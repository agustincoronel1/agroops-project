services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AgroOps Intelligence System
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APPROVAL_API_KEY: ${APPROVAL_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  redis:
    # Redis Stack (RedisJSON + RediSearch) is required by the LangGraph Redis checkpointer.
    image: redis/redis-stack-server:7.4.0-v3
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
  redis_data:
