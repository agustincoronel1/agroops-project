services:
  backend:
    build: ./backend
    # Published on localhost only. The API has no authentication for creating or reading jobs.
    ports:
      - "127.0.0.1:8000:8000"
    # Optional: .env supplies the OpenAI/LangSmith keys and tuning values. Settings in
    # `environment` below win over it for the container network (redis, chroma).
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: AgroOps Intelligence System
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      APPROVAL_API_KEY: ${APPROVAL_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agroops-intelligence}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  redis:
    # Redis Stack (RedisJSON + RediSearch) is required by the LangGraph Redis checkpointer.
    image: redis/redis-stack-server:7.4.0-v3
    # Localhost only, for the integration tests (database 15). The app reaches it inside the network.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    # Localhost only: Chroma has no authentication.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
  redis_data:
